<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>災害メール地図→ Googleマップ変換</title>
<style>
body {
  font-family: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans JP", sans-serif;
  margin: 0;
  padding: 10px 12px;
  line-height: 1.4;
}
h1 {
  font-size: 17px;
  margin: 0 0 6px;
}
.badge {
  display: inline-block;
  font-size: 11px;
  color: #fff;
  background: #0a7;
  padding: 2px 6px;
  border-radius: 4px;
  margin-left: 6px;
  vertical-align: middle;
}
.steps {
  font-size: 13px;
  margin-bottom: 8px;
}
.alert-box {
  background: #ffeeee;
  border: 1px solid #ffcccc;
  padding: 8px;
  border-radius: 6px;
  font-size: 12px;
  margin-bottom: 12px;
}
.alert-box strong {
  color: #d32f2f;
}
.input-label {
  font-size: 14px;
  font-weight: bold;
  color: #d32f2f;
  text-align: center;
  margin: 0 0 4px;
}
textarea {
  width: 100%;
  height: 48px; /* 入力枠をコンパクトに */
  font-size: 14px;
  padding: 8px;
  box-sizing: border-box;
  margin-bottom: 8px;
  border-radius: 6px;
  border: 2px solid #ff3b30;
  background-color: #fff9e6;
}
button {
  font-size: 16px;
  padding: 10px;
  width: 100%;
  cursor: pointer;
  box-sizing: border-box;
  background: #007BFF;
  color: white;
  border: none;
  border-radius: 6px;
  font-weight: bold;
}
.log {
  margin-top: 8px;
  font-size: 13px;
  white-space: pre-wrap;
  background: #f6f6f6;
  padding: 8px;
  border-radius: 6px;
}
#mapArea {
  display: none;
  margin-top: 12px;
}
#mapBtn {
  display: block;
  width: 100%;
  box-sizing: border-box;
  padding: 12px;
  background: #e9e9e9;
  border: 1px solid #ccc;
  border-radius: 8px;
  text-align: center;
  font-size: 18px;
  font-weight: 700;
  color: #000;
  text-decoration: none;
}
</style>
</head>

<body>

<h1>
  災害メール地図→変換
<span class="badge">水利マップ</span>
</h1>

<div class="steps">
① 災害情報MAILのURLをコピー<br>
② 下の枠内を長押しして「ペースト」<br>
③ 「実行」を押し、表示される水利ボタンを押す<br>
④ マップ上部「ここで検索」にペーストし経路検索
</div>

<div class="alert-box">
<strong>⚠️ ナビを開始すると水利表示が消えます</strong><br>
火点付近の水利を目的地とし、現着直前にナビを終了すると水利が戻る場合があります（機種依存）。<br>
※現着時の距離がホース本数の参考になります。<br>
※マイマップのバージョンアップには非対応です。
</div>

<div class="input-label">👇 ここを長押ししてペースト 👇</div>
<textarea id="urlInput" placeholder="URLを貼り付け"></textarea>

<button id="runBtn">実行</button>

<div class="log" id="log">待機中…</div>

<div id="mapArea">
<a id="mapBtn" href="#" target="_blank" rel="noopener noreferrer">水利マップを開く</a>
</div>

<script>
const logEl = document.getElementById("log");
const runBtn = document.getElementById("runBtn");
const urlInput = document.getElementById("urlInput");
const mapArea = document.getElementById("mapArea");
const mapBtnEl = document.getElementById("mapBtn");

function log(msg) {
  logEl.textContent = msg;
}

function parseMapionAngle(input) {
  const s = String(input ?? "").trim();
  if (!s) return NaN;
  const parts = s.split("/");
  if (parts.length === 3) {
    const d = parseFloat(parts[0]), m = parseFloat(parts[1]), sec = parseFloat(parts[2]);
    if (Number.isFinite(d) && Number.isFinite(m) && Number.isFinite(sec)) return d + m / 60 + sec / 3600;
  }
  if (parts.length === 2) {
    const d = parseFloat(parts[0]), m = parseFloat(parts[1]);
    if (Number.isFinite(d) && Number.isFinite(m)) return d + m / 60;
  }
  const v = parseFloat(s);
  return Number.isFinite(v) ? v : NaN;
}

function extractLatLngFromMapion(urlStr) {
  try {
    const u = new URL(urlStr.trim());
    if (u.pathname.startsWith("/m2/")) {
      const parts = u.pathname.slice(4).split(",");
      if (parts.length >= 2) {
        const lat = parseFloat(parts[0]), lng = parseFloat(parts[1]);
        if (Number.isFinite(lat) && Number.isFinite(lng)) return { lat, lng };
      }
    }
    const latQ = u.searchParams.get("lat");
    const lonQ = u.searchParams.get("lon") || u.searchParams.get("lng") || u.searchParams.get("long");
    if (latQ && lonQ) {
      const lat = parseFloat(latQ), lng = parseFloat(lonQ);
      if (Number.isFinite(lat) && Number.isFinite(lng)) return { lat, lng };
    }
    const ll = u.searchParams.get("ll");
    if (ll) {
      const parts = ll.split(",");
      if (parts.length >= 2) {
        const lat = parseFloat(parts[0]), lng = parseFloat(parts[1]);
        if (Number.isFinite(lat) && Number.isFinite(lng)) return { lat, lng };
      }
    }
    if (u.hash && u.hash.includes("ll=")) {
      const match = u.hash.match(/ll=([0-9.+-]+),([0-9.+-]+)/);
      if (match) {
        const lat = parseFloat(match[1]), lng = parseFloat(match[2]);
        if (Number.isFinite(lat) && Number.isFinite(lng)) return { lat, lng };
      }
    }
    const nl = u.searchParams.get("nl"), el = u.searchParams.get("el");
    if (nl && el) {
      const lat = parseMapionAngle(nl), lng = parseMapionAngle(el);
      if (Number.isFinite(lat) && Number.isFinite(lng)) return { lat, lng };
    }
    return null;
  } catch (e) {
    return null;
  }
}

function tokyoToWgs(latTokyo, lonTokyo) {
  const wgsLat = latTokyo - 0.00010695 * latTokyo + 0.000017464 * lonTokyo + 0.0046017;
  const wgsLon = lonTokyo - 0.000046038 * latTokyo - 0.000083043 * lonTokyo + 0.010040;
  return { lat: wgsLat, lng: wgsLon };
}

async function copyText(text) {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (e) {}
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.left = "-9999px";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    const result = document.execCommand("copy");
    document.body.removeChild(ta);
    return result;
  } catch (e) {
    return false;
  }
}

async function handleUrl(urlText) {
  mapArea.style.display = "none";
  log("座標を取得中…");

  const coords = extractLatLngFromMapion(urlText);
  if (!coords) {
    log("座標を読み取れませんでした。\nURLを確認してください。");
    return;
  }

  const converted = tokyoToWgs(coords.lat, coords.lng);
  const lat6 = converted.lat.toFixed(6);
  const lng6 = converted.lng.toFixed(6);
  const coordStr = `${lat6},${lng6}`;

  const params = `&ll=${lat6},${lng6}&z=18`;
  mapBtnEl.href = `https://www.google.com/maps/d/viewer?mid=1bsmlEhct96yonZynraZzo3WGYrcriWs${params}`;

  const copied = await copyText(coordStr);
  if (copied) {
    log(`✓ 座標コピー完了: ${coordStr}\n下の「水利マップを開く」を押してください。`);
  } else {
    log(`⚠️ 自動コピー失敗: ${coordStr}\n長押しして手動コピー後、水利マップを開いてください。`);
  }
  
  mapArea.style.display = "block";
}

runBtn.addEventListener("click", async () => {
  const value = urlInput.value.trim();
  if (!value) {
    alert("URLが入力されていません。枠内に貼り付けてください。");
    urlInput.focus();
    return;
  }
  await handleUrl(value);
});
</script>

</body>
</html>
